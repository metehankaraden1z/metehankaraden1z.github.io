<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { }
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (saved === null && systemDark)) document.documentElement.dataset.theme = 'dark';
    })();
  </script>
  <title>Page not found | Metehan Karadeniz</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2338A8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="512x512" href="/mk-icon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light;
      --cobalt: #2338A8;
      --on-cobalt: #F6F7FF;
      --on-cobalt-2: #C9D1FF;
      --press: #0E1230;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      align-content: center;
      padding: clamp(24px, 6vw, 72px);
      background: var(--cobalt);
      color: var(--on-cobalt);
      font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
      font-size: 18px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--on-cobalt);
      color: var(--cobalt);
    }

    main {
      max-width: 720px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(56px, 12vw, 96px);
      line-height: 0.9;
      font-weight: 900;
      font-variation-settings: "wdth" 62;
      text-transform: uppercase;
    }

    .row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 14px 0;
      margin: 18px 0 26px;
      border-top: 1px solid rgba(246, 247, 255, 0.3);
      border-bottom: 1px solid rgba(246, 247, 255, 0.3);
      font-size: clamp(18px, 2.4vw, 22px);
    }

    .row .pos {
      color: var(--on-cobalt-2);
      font-variant-numeric: tabular-nums;
    }

    .row .lead {
      flex: 1;
      border-bottom: 2px dotted rgba(246, 247, 255, 0.45);
    }

    .row .note {
      color: var(--on-cobalt-2);
      font-size: 0.8em;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 20px;
      font-weight: 700;
      text-decoration: none;
      color: var(--cobalt);
      background: var(--on-cobalt);
      border: 1.5px solid var(--on-cobalt);
    }

    a:hover {
      background: var(--press);
      border-color: var(--press);
      color: var(--on-cobalt);
    }

    a:focus-visible {
      outline: 2px solid var(--on-cobalt);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Not on this record</h1>
    <div class="row" aria-hidden="true"><span class="pos">404</span><span class="lead"></span><span
        class="note">missing track</span></div>
    <p>This page doesn't exist. It may have moved, or the link has a typo.</p>
    <a href="/">Back to the homepage</a>
  </main>
</body>

</html>
